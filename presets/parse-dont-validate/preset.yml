schema_version: "1.0"

preset:
  id: "parse-dont-validate"
  name: "Parse, Don't Validate"
  version: "1.1.1"
  description: "Overrides /speckit-constitution, /speckit-plan, and /speckit-implement to enforce the 'parse, don't validate' discipline across TypeScript and Python — untrusted input stays untyped-safe (`unknown` / unparsed) at the boundary, parsers return branded/nominal domain types, and a deterministic scanner gates completion by flagging `any`/`Any`, stray deserialization, boolean validators, and casts outside parser modules."
  author: "speckit-squads"
  repository: "local"
  license: "same-as-project"

requires:
  speckit_version: ">=0.6.0"

provides:
  scripts:
    - name: "parse_dont_validate.ts"
      file: "scripts/ts/parse_dont_validate.ts"
      executable: true
      description: "checklist + scan for parse-don't-validate anti-patterns in changed TypeScript and Python (any/Any / stray JSON.parse & json.loads / boolean validators / narrowing casts outside parser modules), with line-comment waivers. Run by bun. `scan` anchors change-set detection at the git worktree root (never the cwd) and `--new-only` subtracts findings that already reproduce on the base ref, matched by (file, rule, source text). A scan that examined zero files never exits zero: an unknown option exits 2, unresolvable paths or a non-repo cwd exit 3, and an empty change set exits 4. No line regex: TypeScript via the bun helper's real AST, Python via an in-process Python tokenizer plus a statement-level pass (annotations, def headers, calls, f-string expressions); unbalanced brackets or unterminated strings exit 3. bun built-ins only."
    - name: "pdv_ts_scan.ts"
      file: "scripts/ts/pdv_ts_scan.ts"
      executable: true
      description: "TypeScript helper, run by bun, that walks TypeScript sources with the project's TypeScript Compiler API and emits findings as JSON. Resolves `typescript` from the scanned files' own directories first, so a monorepo package with its own `node_modules` works while the driver runs from the repo root. Requires a TS 5.x `typescript` installed (TS 7 has no compiler API and is skipped); the driver hard-fails (no regex fallback) if none is found. Never prints an empty findings list for a job it could not use — file arguments, empty/malformed stdin and a zero-file job all exit non-zero."

  templates:
    - type: "command"
      name: "speckit.constitution"
      strategy: "wrap"
      file: "commands/speckit.constitution.md"
      description: "Constitution command that always injects a canonical 'Parse, Don't Validate' governance section"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan command that requires a 'Parse Boundaries' design section (trust boundaries + branded domain types + parsers). Chainable: exposes a {CORE_TEMPLATE} seam so other presets can wrap it."
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      strategy: "wrap"
      file: "commands/speckit.implement.md"
      description: "Implement command that applies the parse-don't-validate discipline while writing TypeScript and gates completion on a deterministic anti-pattern scan"

tags:
  - "implement"
  - "typescript"
  - "python"
  - "type-safety"
  - "parsing"
  - "domain-modeling"
  - "functional-programming"
  - "governance"
