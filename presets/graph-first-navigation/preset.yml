schema_version: "1.0"

preset:
  id: "graph-first-navigation"
  name: "Graph-First Navigation"
  version: "2.0.0"
  description: "Makes knowledge-graph queries the default way an agent navigates a codebase, with grep demoted to a stated fallback. Wraps /speckit-plan (records graph-derived callers and dependents per module in a mandatory ## Navigation section), /speckit-tasks (folds those edges into task coverage and ordering), and /speckit-implement (scopes renames, signature changes, and type changes with graphify query before the first edit, then catches every call site with one run of the project's typecheck rather than compiling in a loop). Ships the harness-level half too: a non-blocking PreToolUse hook on Grep|Glob|Bash, registered in the consumer's .claude/settings.json by post-install.sh, that fires only when graphify-out/ exists and only on structurally-shaped patterns. Every layer states the staleness rule (a stale graph means rebuild, not fall back to grep) and the exceptions where grep remains correct."
  author: "imosquera"
  repository: "https://github.com/imosquera/speckit-squads"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  scripts:
    - name: "graph-freshness.sh"
      file: "scripts/bash/graph-freshness.sh"
      executable: true
      description: "Verdict on whether graphify-out/graph.json is fresh relative to the working tree: diffs its built_at_commit against HEAD (ignoring commits that touch only graphify-out/) and checks for uncommitted changes. FRESH (exit 0) / STALE (1) / ABSENT (2) / UNKNOWN (3). STALE means rebuild the graph, never fall back to grep."

    - name: "graph_first_guard.py"
      file: "scripts/python/graph_first_guard.py"
      executable: true
      description: "PreToolUse hook body. Reads the hook payload on stdin and emits a non-blocking reminder (hookSpecificOutput.additionalContext) redirecting structural Grep/Glob calls (and grep/rg shelled through Bash) to graphify query. Fires only when graphify-out/graph.json exists, only on identifier-shaped patterns (never on whitespace/quoted/URL literals or non-code file scopes), and at most 3 times per session. Any internal error exits 0 silently."

    - name: "post-install.sh"
      file: "scripts/bash/post-install.sh"
      executable: true
      description: "Run by install.sh after the preset is registered. Idempotently adds the Grep|Glob|Bash PreToolUse hook to the project's .claude/settings.json and the graph-first navigation rule to its CLAUDE.md (sentinel-delimited block). Presets cannot declare harness hooks, so this is the only seam for the enforcement half. Also removes the typescript-language-server shim a pre-2.0.0 install put on PATH (via remove-lsp-shim.sh)."

    - name: "remove-lsp-shim.sh"
      file: "scripts/bash/remove-lsp-shim.sh"
      executable: true
      description: "Sourced by post-install.sh and pre-uninstall.sh. Removes the typescript-language-server shim installed by versions before 2.0.0 ($SPECKIT_LSP_BIN_DIR, ~/.local/bin, ~/bin, or wherever command -v resolves it) — only a regular file carrying the old shim's marker line, never a real language server binary."

    - name: "pre-uninstall.sh"
      file: "scripts/bash/pre-uninstall.sh"
      executable: true
      description: "Run by uninstall.sh before the preset is removed. Reverses post-install.sh: drops the hook entry from .claude/settings.json and the sentinel block from CLAUDE.md, touching nothing else, and removes a retired pre-2.0.0 language-server shim."

  templates:
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      strategy: "wrap"
      description: "Composable wrapper for /speckit-plan that queries the graph for every module the change touches and records callers, dependents, and provenance in a mandatory ## Navigation section."

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      strategy: "wrap"
      description: "Composable wrapper for /speckit-tasks that folds the plan's graph-derived callers and dependents into task coverage and dependency ordering."

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      strategy: "wrap"
      description: "Composable wrapper for /speckit-implement that scopes renames, signature changes, and type changes with graphify query before the first edit, then catches every call site with one run of the project's typecheck."

tags:
  - "navigation"
  - "graphify"
  - "knowledge-graph"
  - "hooks"
  - "governance"
