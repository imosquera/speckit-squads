schema_version: "1.0"

preset:
  id: "explicit-task-dependencies"
  name: "Explicit Task Dependencies"
  version: "1.1.0"
  description: "Adds explicit (depends on T###) dependency declarations and an Execution Wave DAG to tasks.md, plus a /speckit-implement override that fans each wave's parallel-safe tasks out to subagents in one tool-call batch."
  author: "Quratulain-bilal"
  repository: "https://github.com/Quratulain-bilal/spec-kit-preset-explicit-task-dependencies"
  license: "MIT"

requires:
  speckit_version: ">=0.4.0"

provides:
  templates:
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tasks template with explicit dependency declarations and Execution Wave DAG"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Tasks command with dependency suffix and Wave DAG generation instructions"

    # This preset stays "replace" while the sibling /speckit-implement presets
    # (constitution-audit, graphify-on-implement, implement-prelude-skills,
    # worktree-isolation) are "wrap": those add steps around the execution loop,
    # whereas this one *substitutes* the loop — wave-DAG subagent fan-out instead
    # of the stock serial walk. Wrapping it would run every task twice.
    #
    # Because a replace layer is the composition base and only layers above it
    # compose, this preset must be installed innermost (highest priority number).
    # install.sh pins it to 50 — see the composition-order section in README.md.
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Implement command that walks the Execution Wave DAG and dispatches each wave's [P] tasks to subagents in parallel"
      strategy: "replace"

tags:
  - "dependencies"
  - "parallel"
  - "scheduling"
  - "wave-dag"
  - "subagents"
