schema_version: "1.0"

preset:
  id: "library-research-ios"
  name: "Library Research (iOS)"
  version: "1.2.0"
  description: "iOS half of the library-research pair (library-research is the TypeScript/web half; both coexist in a mixed project). Wraps /speckit-plan so that, after the plan is written, the agent researches whether Apple first-party frameworks or Swift packages can replace hand-rolled Swift/app-side build-it-yourself surface area identified in the plan (networking, Keychain, image caching, persistence, analytics, etc.) using live web search — native frameworks first, then Swift Package Index candidates vetted for iOS deployment target, Swift 6 strict concurrency, license, maintenance, binary size, and SPM support. TypeScript/web surface area is out of scope. Findings and a recommendation per unknown are written to this layer's own `## Library research — iOS` section of the shared research.md, never touching other sections; when a library is a clear win, only the iOS parts of plan.md are revised in place to reference it instead of a custom build. When the plan has no such surface area on this platform, writes only an N/A line in its own section and leaves plan.md alone. Chainable via {CORE_TEMPLATE} so it composes with other speckit.plan wrappers (e.g. parse-dont-validate, spec-minimal)."
  author: "imosquera"
  repository: "https://github.com/imosquera/speckit-squads-ios"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  scripts:
    - name: "jev.ts"
      file: "scripts/ts/jev.ts"
      command: "speckit.plan"
      executable: true

  templates:
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Composable wrapper for /speckit-plan that researches Apple frameworks and Swift packages for the plan's iOS technical unknowns via live web search, revises the iOS parts of plan.md, and writes its own section of research.md."
      strategy: "wrap"

tags:
  - "research"
  - "libraries"
  - "plan"
  - "web-search"
  - "build-vs-buy"
  - "swift"
